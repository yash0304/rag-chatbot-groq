name: Android APK

# Builds an installable APK entirely on GitHub — no laptop needed. The result is attached
# to a Release so it can be downloaded and installed straight from the phone.
#
# The "sideload" build type carries the `.ci` application-id suffix, so it installs
# ALONGSIDE any Android Studio build rather than replacing it. Nothing is ever at risk.
#
# Signing: set two repository secrets (Settings → Secrets and variables → Actions):
#   SIDELOAD_KEYSTORE_BASE64    base64 of the keystore file
#   SIDELOAD_KEYSTORE_PASSWORD  its password
# Without them the build still runs (to check the code compiles) but publishes no Release,
# because a throwaway key would produce an APK that can never be updated in place.

on:
  workflow_dispatch:
  push:
    branches: [main, "claude/**"]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing keystore
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.SIDELOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > android/sideload.keystore
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Keystore restored — this APK can update the previous one in place."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No SIDELOAD_KEYSTORE_BASE64 secret. Compiling only; no Release will be published."
          fi

      - name: Build APK
        working-directory: android
        env:
          SIDELOAD_KEYSTORE_PASSWORD: ${{ secrets.SIDELOAD_KEYSTORE_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleSideload

      - name: Stage APKs
        id: apk
        run: |
          dir=android/app/build/outputs/apk/sideload
          n="${{ github.run_number }}"
          mkdir -p out
          # One APK per architecture. arm64 is listed first so it is the top asset on the
          # release page — it is what every phone from roughly 2017 onward needs.
          declare -A names=( [arm64-v8a]="arm64" [armeabi-v7a]="arm32" )
          found=0
          for abi in arm64-v8a armeabi-v7a; do
            src="$dir/app-$abi-sideload.apk"
            if [ -f "$src" ]; then
              cp "$src" "out/MindQuest-$n-${names[$abi]}.apk"
              found=$((found+1))
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo "No split APKs found; falling back to the fat APK."
            find "$dir" -name '*.apk'
            cp "$dir/app-sideload.apk" "out/MindQuest-$n.apk"
          fi
          ls -lh out/

      - uses: actions/upload-artifact@v4
        with:
          name: MindQuest-apk-${{ github.run_number }}
          path: out/*.apk

      - name: Publish Release
        if: steps.keystore.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-${{ github.run_number }}" \
            --title "MindQuest APK #${{ github.run_number }}" \
            --target "${{ github.sha }}" \
            --notes "Built from \`${{ github.ref_name }}\` (${{ github.sha }}).

          **Take the \`-arm64\` APK** unless your phone is genuinely 32-bit — one APK per CPU
          architecture, so each is much smaller than a combined build.

          Installs as \`com.mindquest.app.ci\`, alongside any Android Studio build." \
            out/*.apk
          echo "Release: ${{ github.server_url }}/${{ github.repository }}/releases/latest"
