name: CI

# The active project is the offline Android app (android/), which is built in Android
# Studio and not gated here (no Android SDK on default runners). These jobs still exercise
# the archived web stack under legacy/ so its history stays green.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  legacy-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: legacy/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: legacy/backend/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check app tests
      - name: "Tests (offline: SQLite + stub AI + in-memory vectors)"
        run: pytest -q --cov=app --cov-report=term-missing

  legacy-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: legacy/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: legacy/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  legacy-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose -f legacy/docker-compose.yml config -q
