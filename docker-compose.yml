services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mindquest
      POSTGRES_PASSWORD: mindquest
      POSTGRES_DB: mindquest
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mindquest"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.12.4
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+psycopg://mindquest:mindquest@postgres:5432/mindquest
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
      VECTOR_BACKEND: qdrant
      AI_PROVIDER: ${AI_PROVIDER:-stub}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me}
      CORS_ORIGINS: http://localhost:3000
      STORAGE_DIR: /srv/data/uploads
    volumes:
      - uploads:/srv/data/uploads
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    environment:
      API_INTERNAL_URL: http://backend:8000
    ports:
      - "3000:3000"

volumes:
  pgdata:
  qdrant_data:
  redis_data:
  uploads:
